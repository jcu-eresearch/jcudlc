# Configuration for generating website data from the library spreadsheet.

excel:
  file: inputs/library-index.xlsx
  sheet: MASTER
  rows:
    filter: 1
    search: 2
    full_display: 3
    multi_option: 4
    column_headers: 5

documents:
  source_path: /Volumes/PHTM_PacELF/b PacELF Documents
  destination_path: ../public/documents
  file_pattern: "**/*"

columns:
  id: ID
  title: Title
  year: Year
  access: Access_Rights
  filename: PDF_file_name
  published_url: View_at_Publisher
  status: Portal_Status
  generated:
    display_url: URL
    display_icon: Icon

values:
  access:
    open: Open
    physical_library: Contact PacELF at JCU
    publisher: Open via Publisher
  status:
    active: Active
    deleted: Delete

website:
  urls:
    download_prefix: /documents/
    physical_library: ""
    contact_us: /#/contact-us
  icons:
    webpage: open_in_new
    download: file_download
    support: contact_support
    library: schedule

general:
  missing_value_token: NO VALUE

query:
  sortings:
    name_asc:
      fields: [Title]
      order: [asc]
    year_name_asc:
      fields: [Year, Title]
      order: [desc, asc]
