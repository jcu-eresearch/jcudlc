# Configuration for generating website data from the library spreadsheet.

runtime:
  # Relative paths are resolved from the directory where the scripts are run.
  excel_file: ../examples/library-index.xlsx
  documents_dir: ../examples/documents
  output_dir: outputs
  log_dir: logs
  static_config_file: inputs/jcudlc-config-static.json

excel:
  sheet: MAIN
  # Exact, case-sensitive markers; use [] to preserve all literal values.
  empty_cell_markers: ["NA", "nan", "NaN", "N/A", "n/a", "NULL"]
  # These are spreadsheet row numbers, starting at 1, as shown in Excel.
  rows:
    filter: 2
    search: 3
    full_display: 4
    multi_option: 5
    column_headers: 6

documents:
  file_pattern: "**/*"

columns:
  id: ID
  title: Title
  year: Year
  access: Access
  filename: PDF_file_name
  published_url: Published_URL
  status: Portal_Status
  generated:
    display_url: URL
    display_icon: Icon

# Translates the values in the spreadsheet to the values used in the scripts for validation and to provide
# the correct behaviour for the website. For example, the spreadsheet may have "Open" (or some other value to be displayed
# on the website) in the Access column, but the scripts need to use "open" to validate and generate the correct URL and icon.
values:
  access:
    open: Open
    physical_library: Contact us
    publisher: Access via publisher
  status:
    active: Active
    deleted: Delete

website:
  urls:
    download_prefix: /documents/
    physical_library: ""
    contact_us: /#/contact-us
  icons:
    webpage: open_in_new
    download: file_download
    support: contact_support
    library: schedule
